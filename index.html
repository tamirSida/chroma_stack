<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e0e1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>Chroma Stack</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e0e1a'/%3E%3Crect x='6' y='6' width='8' height='8' rx='2' fill='%23ff4d6d'/%3E%3Crect x='18' y='6' width='8' height='8' rx='2' fill='%234dabf7'/%3E%3Crect x='6' y='18' width='8' height='8' rx='2' fill='%23ffd43b'/%3E%3Crect x='18' y='18' width='8' height='8' rx='2' fill='%2351cf66'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="score-wrap">
          <span class="score-label">Score</span>
          <span class="score" id="score">0</span>
          <span class="best" id="best">Best 0</span>
        </div>
        <div class="combo" id="combo">×1</div>
        <div class="actions">
          <span class="coins" id="coins" title="Coins"><span class="coin-icon">●</span><span id="coins-num">0</span></span>
          <button class="icon-btn" id="btn-leaderboard" aria-label="Leaderboard">🏆</button>
          <button class="icon-btn" id="btn-settings" aria-label="Settings">⚙</button>
        </div>
      </header>
      <div class="board-wrap">
        <div class="board" id="board"></div>
      </div>
      <div class="tray" id="tray"></div>
      <div class="powers" id="powers"></div>
      <div class="targeting-bar" id="targeting-bar" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
